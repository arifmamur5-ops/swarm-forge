[project]
name = "swarm-forge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ariif Ma'mur", email = "arifmamur5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[project.scripts]
swarm-forge = "swarm_forge:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
